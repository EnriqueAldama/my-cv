name: Build CV PDFs

on:
  push:
    branches: [main]
    paths: ["*.tex", ".github/workflows/build-cv.yml"]
  pull_request:
    paths: ["*.tex", ".github/workflows/build-cv.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-cv-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile LaTeX
        uses: xu-cheng/latex-action@v3
        with:
          root_file: |
            Enrique-Aldama-CV-ES.tex
            Enrique-Aldama-CV-EN.tex
          latexmk_use_xelatex: false

      - name: Upload PDFs as artifact
        uses: actions/upload-artifact@v4
        with:
          name: cv-pdfs
          path: Enrique-Aldama-CV-*.pdf

      # Commit the rebuilt PDFs back to main so the repo always shows the latest.
      # The bot's commit does not retrigger this workflow (GITHUB_TOKEN pushes
      # never do, and *.pdf is outside the `paths` filter).
      - name: Commit updated PDFs
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Enrique-Aldama-CV-ES.pdf Enrique-Aldama-CV-EN.pdf
          git diff --cached --quiet || git commit -m "chore: rebuild CV PDFs [skip ci]"
          git push
